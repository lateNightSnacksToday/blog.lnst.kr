<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Articles</title>
  <link
    href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&family=DM+Mono:wght@300;400;500&display=swap"
    rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0a0a0a;
      --card: #111111;
      --border: #222222;
      --border-focus: #444444;
      --text: #e8e8e8;
      --text-dim: #555555;
      --accent: #ffffff;
      --accent-dim: rgba(255,255,255,0.08);
      --radius: 18px;
      --item-radius: 12px;
    }

    body {
      background: var(--bg);
      min-height: 100vh;
      font-family: 'Noto Sans KR', sans-serif;
      color: var(--text);
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(255,255,255,0.015) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.015) 1px, transparent 1px);
      background-size: 48px 48px;
      pointer-events: none;
      z-index: 0;
    }

    .page {
      position: relative;
      z-index: 1;
      max-width: 540px;
      margin: 0 auto;
      padding: 48px 20px 100px;
      animation: fadeUp 0.45s cubic-bezier(.22,.68,0,1.2) both;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .page-title {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.5px;
      text-align: center;
      margin-bottom: 32px;
      color: var(--text);
    }

    .page-title span { color: var(--accent); }

    .article-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .article-item {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--item-radius);
      padding: 16px 20px;
      cursor: pointer;
      transition: border-color 0.2s, background 0.2s;
      animation: itemIn 0.3s ease both;
    }

    .article-item:hover {
      border-color: var(--border-focus);
      background: #161616;
    }

    @keyframes itemIn {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .article-title {
      font-size: 14px;
      font-weight: 500;
      color: var(--text);
      margin-bottom: 5px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .article-preview {
      font-size: 12px;
      color: var(--text-dim);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .empty-state {
      text-align: center;
      color: var(--text-dim);
      font-size: 13px;
      padding: 48px 0;
    }

    .skeleton {
      background: #161616;
      border: 1px solid var(--border);
      border-radius: var(--item-radius);
      padding: 16px 20px;
      animation: pulse 1.4s ease-in-out infinite;
    }

    .skeleton-line {
      height: 12px;
      border-radius: 6px;
      background: #222;
    }

    .skeleton-line.title { width: 55%; margin-bottom: 8px; }
    .skeleton-line.body  { width: 80%; }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0.5; }
    }

    .pagination {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      padding: 14px 20px;
      background: rgba(10,10,10,0.88);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-top: 1px solid var(--border);
    }

    .write-btn {
      position: absolute;
      right: 20px;
      background: #161616;
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-family: 'Noto Sans KR', sans-serif;
      font-size: 13px;
      font-weight: 500;
      padding: 8px 18px;
      cursor: pointer;
      transition: border-color 0.2s, background 0.2s, transform 0.15s;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
    }

    .write-btn:hover {
      border-color: var(--border-focus);
      background: #1e1e1e;
      transform: translateY(-1px);
    }

    .write-btn:active { transform: translateY(0); }

    .page-btn {
      background: #161616;
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-family: 'Noto Sans KR', sans-serif;
      font-size: 13px;
      font-weight: 500;
      padding: 8px 20px;
      cursor: pointer;
      transition: border-color 0.2s, background 0.2s, transform 0.15s;
    }

    .page-btn:hover:not(:disabled) {
      border-color: var(--border-focus);
      background: #1e1e1e;
      transform: translateY(-1px);
    }

    .page-btn:active:not(:disabled) { transform: translateY(0); }

    .page-btn:disabled {
      opacity: 0.3;
      cursor: not-allowed;
      transform: none !important;
    }

    .page-info {
      font-family: 'DM Mono', monospace;
      font-size: 12px;
      color: var(--text-dim);
      min-width: 72px;
      text-align: center;
    }

    /* ── Toast ── */
    #toast-container {
      position: fixed;
      bottom: 60px;
      right: 24px;
      z-index: 9999;
      pointer-events: none;
    }

    .toast {
      pointer-events: all;
      position: absolute;
      right: 0;
      border-radius: 10px;
      padding: 14px 16px 10px 16px;
      width: 270px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.7);
      overflow: hidden;
      will-change: transform, opacity;
    }

    .toast-header { display: flex; align-items: center; gap: 7px; margin-bottom: 5px; }
    .toast-icon   { width: 15px; height: 15px; flex-shrink: 0; }
    .toast-title  { font-size: 0.8rem; font-weight: 700; letter-spacing: 0.3px; }
    .toast-msg    { font-size: 0.82rem; margin-bottom: 10px; padding-left: 22px; line-height: 1.4; }
    .toast-progress-track { height: 3px; border-radius: 99px; overflow: hidden; margin: 0 -1px; }
    .toast-progress-bar   { height: 100%; width: 100%; border-radius: 99px; }
  </style>
</head>

<body>
  <div class="page">
    <div class="page-title">게시<span>글</span></div>
    <div class="article-list" id="articleList">
      <div class="skeleton"><div class="skeleton-line title"></div><div class="skeleton-line body"></div></div>
      <div class="skeleton"><div class="skeleton-line title"></div><div class="skeleton-line body"></div></div>
      <div class="skeleton"><div class="skeleton-line title"></div><div class="skeleton-line body"></div></div>
    </div>
  </div>

  <div class="pagination">
    <button class="page-btn" id="prevBtn" onclick="goPrev()" disabled>이전</button>
    <span class="page-info" id="pageInfo">— / —</span>
    <button class="page-btn" id="nextBtn" onclick="goNext()" disabled>다음</button>
    <a class="write-btn" href="/articles/write">작성</a>
  </div>

  <div id="toast-container"></div>

  <script>
    const params   = new URLSearchParams(window.location.search);
    const id       = params.get('id');
    const list     = document.getElementById('articleList');
    const pageInfo = document.getElementById('pageInfo');
    const prevBtn  = document.getElementById('prevBtn');
    const nextBtn  = document.getElementById('nextBtn');
    let page     = 1;
    let maxPage  = 0;

    const GAP = 10, BOTTOM_OFFSET = 24;
    const toastList = [];
    const TOAST_THEMES = {
      error: { bg:'#1e0a0a', border:'rgba(220,50,50,0.45)', accent:'#e03030', titleColor:'#e86060', msgColor:'rgba(220,180,180,0.8)', trackBg:'rgba(220,50,50,0.15)', icon:`<circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/>` },
    };

    function layoutToasts() {
      let cursor = BOTTOM_OFFSET;
      for (let i = toastList.length-1; i >= 0; i--) {
        const { el } = toastList[i];
        el.style.transition = 'bottom 0.38s cubic-bezier(0.16,1,0.3,1), opacity 0.28s ease, transform 0.38s cubic-bezier(0.16,1,0.3,1)';
        el.style.bottom = cursor + 'px';
        cursor += el.offsetHeight + GAP;
      }
    }

    function toastError(title, message) {
      const theme = TOAST_THEMES.error;
      const container = document.getElementById('toast-container');
      const toast = document.createElement('div');
      toast.className = 'toast';
      toast.style.cssText = `background:${theme.bg};border:1px solid ${theme.border};border-left:3px solid ${theme.accent};`;
      toast.innerHTML = `
        <div class="toast-header">
          <svg class="toast-icon" style="color:${theme.accent}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">${theme.icon}</svg>
          <span class="toast-title" style="color:${theme.titleColor}">${title}</span>
        </div>
        <div class="toast-msg" style="color:${theme.msgColor}">${message}</div>
        <div class="toast-progress-track" style="background:${theme.trackBg}">
          <div class="toast-progress-bar" style="background:${theme.accent}"></div>
        </div>`;
      toast.style.cssText += 'opacity:0;transform:translateX(20px);bottom:24px;transition:none;';
      container.appendChild(toast);
      toastList.push({ el: toast });
      layoutToasts();
      requestAnimationFrame(() => requestAnimationFrame(() => {
        toast.style.transition = 'bottom 0.38s cubic-bezier(0.16,1,0.3,1), opacity 0.28s ease, transform 0.38s cubic-bezier(0.16,1,0.3,1)';
        toast.style.opacity = '1';
        toast.style.transform = 'translateX(0)';
      }));
      const bar = toast.querySelector('.toast-progress-bar');
      bar.style.transition = 'width 3s linear';
      requestAnimationFrame(() => requestAnimationFrame(() => { bar.style.width = '0%'; }));
      setTimeout(() => {
        toast.style.transition = 'opacity 0.25s ease, transform 0.25s ease';
        toast.style.opacity = '0';
        toast.style.transform = 'translateX(20px)';
        setTimeout(() => {
          const idx = toastList.findIndex(t => t.el === toast);
          if (idx !== -1) toastList.splice(idx, 1);
          toast.remove();
          layoutToasts();
        }, 260);
      }, 3000);
    }

    function preview(text) {
      if (!text) return '';
      const plain = text.replace(/\s+/g, ' ').trim();
      return plain.length > 10 ? plain.slice(0, 10) + '...' : plain;
    }

    function loadPage() {
      prevBtn.disabled = true;
      nextBtn.disabled = true;

      fetch('/api/articles/list', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ page: page - 1 }),
      })
        .then(res => res.json())
        .then(data => {
          if (!data.success) {
            toastError('오류', '게시글을 불러오지 못했습니다.');
            list.innerHTML = `<div class="empty-state">불러오기 실패</div>`;
            return;
          }

          maxPage = data.maxPage || 1;
          pageInfo.textContent = `${page} / ${maxPage}`;
          prevBtn.disabled = page <= 1;
          nextBtn.disabled = page >= maxPage;

          if (!data.blogs || data.blogs.length === 0) {
            list.innerHTML = `<div class="empty-state">게시글이 없습니다.</div>`;
            return;
          }

          const nodes = data.blogs.map((blog, idx) => {
            const el = document.createElement('div');
            el.className = 'article-item';
            el.style.animationDelay = `${idx * 0.04}s`;

            const titleEl = document.createElement('div');
            titleEl.className = 'article-title';
            titleEl.textContent = blog.title || '제목 없음';

            const previewEl = document.createElement('div');
            previewEl.className = 'article-preview';
            previewEl.textContent = preview(blog.content);

            el.append(titleEl, previewEl);
            return el;
          });
          list.replaceChildren(...nodes);
        })
        .catch(() => {
          toastError('네트워크 오류', '요청 중 문제가 발생했습니다.');
          list.innerHTML = `<div class="empty-state">불러오기 실패</div>`;
        });
    }

    function goPrev() { if (page > 1)       { page--; loadPage(); } }
    function goNext() { if (page < maxPage) { page++; loadPage(); } }

    loadPage();
  </script>
</body>

</html>
