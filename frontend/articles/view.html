<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Articles</title>
</head>

<body>
    <ol></ol>
    <span>page: 0/?</span>
    <br>
    <button onclick="blog_prev()">이전</button>
    <button onclick="blog_next()">다음</button>
    <script>
        const params = new URLSearchParams(window.location.search);

        const id = params.get('id');
        const list = document.querySelector("ol");
        const span = document.querySelector("span");
        let page = 1;
        let max_page = 0;

        function load_page() {
            fetch("/articles/view", {
                method: "post",
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ id, page: page-1 }),
            })
                .then(res => res.json())
                .then(data => {
                    if (data.success) {
                        max_page=data.maxPage;
                        span.textContent=`page: ${page}/${max_page}`;
                        let blog_nodes = [];
                        for (blog of data.blogs) {
                            const new_li = document.createElement("li");
                            new_li.textContent = `title: ${blog.title}, content: ${blog.content}`;
                            blog_nodes.push(new_li);
                        }
                        list.replaceChildren(...blog_nodes);
                    } else {
                        alert("게시글 불러오기 실패");
                    }
                });
        }

        function blog_prev() {
            page=Math.max(1,page-1);
            load_page();
        }
        function blog_next() {
            page=Math.min(max_page,page+1);
            load_page();
        }

        load_page()
    </script>
</body>

</html>
